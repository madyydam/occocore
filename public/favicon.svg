<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100" height="100">
  <defs>
    <linearGradient id="ring1Grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#c084fc" />
      <stop offset="50%" stop-color="#818cf8" />
      <stop offset="100%" stop-color="#4f46e5" />
    </linearGradient>
    <linearGradient id="ring2Grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="50%" stop-color="#06b6d4" />
      <stop offset="100%" stop-color="#2563eb" />
    </linearGradient>
    <filter id="neonGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="100" height="100" rx="22" fill="#090d16" />
  
  <!-- Outer subtle aura -->
  <circle cx="38" cy="50" r="24" fill="none" stroke="rgba(192, 132, 252, 0.25)" stroke-width="8" filter="url(#neonGlow)" />
  <circle cx="62" cy="50" r="24" fill="none" stroke="rgba(56, 189, 248, 0.25)" stroke-width="8" filter="url(#neonGlow)" />

  <!-- Ring 1 (Left: Violet) -->
  <circle cx="38" cy="50" r="20" fill="none" stroke="url(#ring1Grad)" stroke-width="6" />

  <!-- Ring 2 (Right: Cyan) with interlock mask illusion -->
  <circle cx="62" cy="50" r="20" fill="none" stroke="url(#ring2Grad)" stroke-width="6" />

  <!-- Core intersection shine -->
  <ellipse cx="50" cy="50" rx="4" ry="12" fill="none" stroke="rgba(255, 255, 255, 0.85)" stroke-width="2" opacity="0.6" />
</svg>
